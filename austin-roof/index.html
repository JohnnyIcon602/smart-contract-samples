<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emergency Roof Repair Austin TX - 24/7</title>
  <meta name="description" content="Fast, Reliable Emergency Roof Services in Austin TX. 24/7 emergency repair. Call now!">
  <form name="lead" netlify netlify-honeypot="bot-field">
    <input type="hidden" name="form-name" value="lead">
    <p hidden><label>Don't fill this out: <input name="bot-field"></label></p>
  </form>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1419; color: #fff; min-height: 100vh; }
    .hero { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 60px 20px; text-align: center; }
    .hero h1 { font-size: 2.5rem; margin-bottom: 10px; color: #ff6b35; }
    .hero p { font-size: 1.2rem; color: #a0a0a0; margin-bottom: 20px; }
    .phone { font-size: 1.5rem; color: #fff; text-decoration: none; display: inline-block; background: #ff6b35; padding: 15px 30px; border-radius: 8px; font-weight: bold; }
    .phone:hover { background: #e55a2b; }
    .container { max-width: 600px; margin: 0 auto; padding: 40px 20px; }
    .form-card { background: #1e2a3a; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .form-card h2 { margin-bottom: 20px; color: #ff6b35; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #3a4a5a; background: #0f1419; color: #fff; font-size: 1rem; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #ff6b35; }
    .form-group textarea { min-height: 100px; resize: vertical; }
    .submit-btn { width: 100%; padding: 15px; background: #ff6b35; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
    .submit-btn:hover { background: #e55a2b; }
    .footer { text-align: center; padding: 40px 20px; color: #666; font-size: 0.9rem; }
    @media (max-width: 600px) {
      .hero h1 { font-size: 1.8rem; }
      .hero p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Emergency Roof Repair Austin TX</h1>
    <p>Fast, Reliable Emergency Roof Services - 24/7</p>
    <a href="tel:+17372525974" class="phone">📞 Call (737) 252-5974</a>
  </div>
  
  <div class="container">
    <div class="form-card">
      <h2>Get a Fast Quote</h2>
      <form name="lead" method="POST" data-netlify="true" netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="lead">
        <p hidden><label>Don't fill this out: <input name="bot-field"></label></p>
        
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="John Smith" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="(512) 555-0123" required>
        </div>
        
        <div class="form-group">
          <label for="message">Describe Your Issue</label>
          <textarea id="message" name="message" placeholder="Tell us about your roof emergency..." required></textarea>
        </div>
        
        <button type="submit" class="submit-btn">Get Free Quote</button>
      </form>
    </div>
  </div>
  
  <div class="footer">
    <p>Serving Austin and surrounding areas</p>
  </div>
</body>
</html>
