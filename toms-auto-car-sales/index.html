<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tom's Auto Car Sales</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-dark: #0a0a0a;
            --bg-card: rgba(20, 20, 20, 0.8);
            --neon-green: #39ff14;
            --neon-pink: #ff00ff;
            --neon-cyan: #00ffff;
            --text-light: #e0e0e0;
            --text-dim: #888;
            --border-glow: rgba(57, 255, 20, 0.3);
        }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            background-image: 
                radial-gradient(ellipse at 20% 80%, rgba(57, 255, 20, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 0, 255, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0a 0%, #111 100%);
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 40px 0; position: relative; }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(57, 255, 20, 0.5);
            letter-spacing: 4px;
        }
        h1::before {
            content: "TOM'S AUTO";
            display: block;
            font-size: 1rem;
            letter-spacing: 8px;
            color: var(--neon-pink);
            -webkit-text-fill-color: var(--neon-pink);
            margin-bottom: 5px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-green), var(--neon-pink));
        }
        .stat-card h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--neon-green);
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
        }
        .stat-card.profit .value { color: var(--neon-cyan); }
        .stat-card.loss .value { color: var(--neon-pink); }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 14px 20px;
            padding-left: 45px;
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            color: var(--text-light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .search-box input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }
        .search-box::before {
            content: '⌕';
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-green);
            font-size: 1.2rem;
        }
        .btn {
            padding: 14px 28px;
            background: transparent;
            border: 2px solid var(--neon-green);
            border-radius: 12px;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn:hover {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.4);
        }
        .btn-pink {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .btn-pink:hover {
            background: var(--neon-pink);
            color: var(--bg-dark);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4);
        }
        .btn-small {
            padding: 8px 16px;
            font-size: 0.75rem;
        }
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 25px;
        }
        .car-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            position: relative;
            transition: all 0.3s;
        }
        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .car-card .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .car-card .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: var(--neon-green);
        }
        .car-card .year { color: var(--neon-pink); font-weight: 700; }
        .car-card .vin {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
            font-family: monospace;
        }
        .car-card .actions { display: flex; gap: 8px; }
        .car-card .actions button {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 5px;
            transition: all 0.3s;
        }
        .car-card .actions button:hover { color: var(--neon-green); }
        .car-card .actions button.delete:hover { color: var(--neon-pink); }
        .car-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .car-details .detail {
            background: rgba(57, 255, 20, 0.05);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(57, 255, 20, 0.1);
        }
        .car-details .detail label {
            display: block;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .car-details .detail span {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-light);
        }
        .car-details .detail.profit span { color: var(--neon-cyan); }
        .car-details .detail.loss span { color: var(--neon-pink); }
        .expenses-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .expenses-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .expenses-header h4 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-pink);
            letter-spacing: 2px;
        }
        .expenses-header .total { color: var(--neon-pink); font-weight: 700; }
        .expense-list { max-height: 150px; overflow-y: auto; }
        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 0, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }
        .expense-item .desc { flex: 1; }
        .expense-item .amount {
            color: var(--neon-pink);
            font-weight: 600;
            margin-right: 10px;
        }
        .expense-item .delete-expense {
            background: none;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1rem;
        }
        .expense-item .delete-expense:hover { color: var(--neon-pink); }
        .add-expense-btn {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: transparent;
            border: 1px dashed var(--neon-pink);
            border-radius: 8px;
            color: var(--neon-pink);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .add-expense-btn:hover { background: rgba(255, 0, 255, 0.1); }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-green);
            margin-bottom: 30px;
            text-align: center;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 14px 18px;
            background: rgba(57, 255, 20, 0.05);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 10px;
            color: var(--text-light);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
        }
        .empty-state h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        /* Auth Screen */
        .auth-screen {
            display: none;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-screen.active { display: flex; }
        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glow);
            border-radius: 24px;
            padding: 50px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .auth-card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-green);
            margin-bottom: 30px;
        }
        .auth-card .toggle-link {
            margin-top: 20px;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .auth-card .toggle-link a {
            color: var(--neon-pink);
            cursor: pointer;
            text-decoration: underline;
        }
        .error-msg {
            color: var(--neon-pink);
            margin-top: 15px;
            font-size: 0.9rem;
        }
        .user-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .user-bar .user-email {
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 3px; }
        @media (max-width: 768px) {
            h1 { font-size: 2rem; }
            .cars-grid { grid-template-columns: 1fr; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen active" id="authScreen">
        <div class="auth-card">
            <h2 id="authTitle">Sign In</h2>
            <form id="authForm">
                <div class="form-group full">
                    <label>Email</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="form-group full">
                    <label>Password</label>
                    <input type="password" id="authPassword" required>
                </div>
                <button type="submit" class="btn" id="authBtn">Sign In</button>
                <div class="error-msg" id="authError"></div>
            </form>
            <div class="toggle-link">
                <span id="toggleText">Don't have an account?</span> 
                <a id="toggleAuth" onclick="toggleAuthMode()">Sign Up</a>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div class="container" id="appScreen" style="display: none;">
        <header>
            <h1>Tom's Auto Car Sales</h1>
        </header>
        
        <div class="user-bar">
            <span class="user-email" id="userEmail"></span>
            <button class="btn btn-small btn-pink" onclick="signOut()">Sign Out</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>TOTAL CARS</h3>
                <div class="value" id="totalCars">0</div>
            </div>
            <div class="stat-card">
                <h3>SOLD</h3>
                <div class="value" id="carsSold">0</div>
            </div>
            <div class="stat-card">
                <h3>IN STOCK</h3>
                <div class="value" id="carsInStock">0</div>
            </div>
            <div class="stat-card profit">
                <h3>TOTAL PROFIT</h3>
                <div class="value" id="totalProfit">$0</div>
            </div>
        </div>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search by make, model, year...">
            </div>
            <button class="btn" onclick="openModal()">+ Add Car</button>
        </div>

        <div class="cars-grid" id="carsGrid">
            <div class="empty-state">
                <h3>NO CARS YET</h3>
                <p>Add your first car to get started</p>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div class="loading" id="loadingScreen">LOADING...</div>

    <!-- Add/Edit Car Modal -->
    <div class="modal" id="carModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Car</h2>
            <form id="carForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Year *</label>
                        <input type="number" id="year" required min="1900" max="2030">
                    </div>
                    <div class="form-group">
                        <label>Make *</label>
                        <input type="text" id="make" required>
                    </div>
                    <div class="form-group">
                        <label>Model *</label>
                        <input type="text" id="model" required>
                    </div>
                    <div class="form-group">
                        <label>VIN *</label>
                        <input type="text" id="vin" required>
                    </div>
                    <div class="form-group">
                        <label>Purchase Date *</label>
                        <input type="date" id="purchaseDate" required>
                    </div>
                    <div class="form-group">
                        <label>Purchase Price ($) *</label>
                        <input type="number" id="purchasePrice" required min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Sale Price ($)</label>
                        <input type="number" id="salePrice" min="0" step="0.01">
                    </div>
                    <div class="form-group">
                        <label>Sale Date</label>
                        <input type="date" id="saleDate">
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" id="includeInReports" checked style="width: auto;">
                            Include in Reports
                        </label>
                    </div>
                </div>
                <input type="hidden" id="carId">
                <div class="modal-buttons">
                    <button type="button" class="btn btn-pink" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn">Save Car</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Add Expense Modal -->
    <div class="modal" id="expenseModal">
        <div class="modal-content">
            <h2>Add Expense</h2>
            <form id="expenseForm">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Description</label>
                        <input type="text" id="expenseDesc" required placeholder="e.g., Brake pads, Oil change">
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="expenseCategory">
                            <option value="repair">Repair</option>
                            <option value="parts">Parts</option>
                            <option value="detailing">Detailing</option>
                            <option value="mechanic">Mechanic</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Amount ($)</label>
                        <input type="number" id="expenseAmount" required min="0" step="0.01">
                    </div>
                    <div class="form-group full">
                        <label>Date</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                </div>
                <input type="hidden" id="expenseCarId">
                <div class="modal-buttons">
                    <button type="button" class="btn btn-pink" onclick="closeExpenseModal()">Cancel</button>
                    <button type="submit" class="btn">Add Expense</button>
                </div>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
