<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
</head>
<body>
    <h1>Simple Test</h1>
    <button id="btn">Click me</button>
    <p id="output"></p>
    <script>
        document.getElementById('btn').addEventListener('click', function() {
            document.getElementById('output').textContent = 'It works!';
        });
    </script>
</body>
</html>
