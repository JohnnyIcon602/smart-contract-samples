<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Louisiana Washer & Dryer Repair | Expert Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #0d1b2a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            padding: 30px;
            text-align: center;
            color: #fff;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 16px;
            opacity: 0.9;
        }
        .content { padding: 30px; }
        .problem {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 0 8px 8px 0;
        }
        .problem h3 { color: #92400e; font-size: 16px; margin-bottom: 5px; }
        .problem p { color: #b45309; font-size: 14px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #f59e0b;
        }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }
        
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
        }
        .footer {
            background: #f9fafb;
            padding: 20px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }
        .footer a { color: #f59e0b; text-decoration: none; }
        
        .success {
            display: none;
            text-align: center;
            padding: 40px;
        }
        .success h2 { color: #059669; margin-bottom: 10px; }
        .success p { color: #6b7280; }
        
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f3f4f6;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .checkbox-item:hover { background: #e5e7eb; }
        .checkbox-item input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛠️ Louisiana Washer & Dryer Repair</h1>
            <p>Fast, Reliable Service Across Louisiana</p>
        </div>
        
        <div class="content">
            <div class="problem">
                <h3>🔥 Same-Day Service Available</h3>
                <p>Don't wait days for your repair. Book now and get served fast!</p>
            </div>
            
            <form id="leadForm">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" name="name" required placeholder="John Smith">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone" required placeholder="(225) 555-0123">
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <input type="text" name="city" required placeholder="Baton Rouge">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>What needs to be repaired?</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="appliance" value="washer"> washer
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="appliance" value="dryer"> Dryer
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="appliance" value="both"> Both
                        </label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>What's the issue?</label>
                    <select name="issue" required>
                        <option value="">Select an issue...</option>
                        <option value="not-starting">Won't start</option>
                        <option value="not-spinning">Not spinning</option>
                        <option value="not-drying">Not drying</option>
                        <option value="leaking">Leaking water</option>
                        <option value="noise">Making noise</option>
                        <option value="error-codes">Showing error codes</option>
                        <option value="other">Other / Multiple issues</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Describe the problem (optional)</label>
                    <textarea name="description" rows="3" placeholder="Any additional details..."></textarea>
                </div>
                
                <button type="submit">📞 Request Service Call</button>
            </form>
            
            <div class="success" id="success">
                <h2>✅ Request Received!</h2>
                <p>We'll call you within the hour to schedule your service.</p>
            </div>
        </div>
        
        <div class="footer">
            <p>Serving all of Louisiana | <a href="tel:+12255550123">Call (225) 555-0123</a></p>
        </div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Collect checkboxes
            const appliances = [];
            document.querySelectorAll('input[name="appliance"]:checked').forEach(cb => {
                appliances.push(cb.value);
            });
            data.appliances = appliances;
            
            // In production, send to your backend/Google Sheets/Airtable
            console.log('Lead captured:', data);
            
            // Show success
            this.style.display = 'none';
            document.getElementById('success').style.display = 'block';
        });
    </script>
</body>
</html>
